name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: shellcheck install.sh update.sh scripts/*.sh templates/*/*.sh
      - name: node syntax
        run: for f in lib/*.mjs modules/*/*.mjs templates/*/bin/*.mjs; do node --check "$f"; done
      - name: update, saved-answers, tool-check and privacy-scan tests
        run: node --test test/update.test.mjs test/answers.test.mjs test/tools.test.mjs test/privacy.test.mjs
      - name: simulated dry runs for every platform
        run: |
          for os in linux macos wsl windows; do
            node lib/installer.mjs --dry-run --yes --modules all --answers answers.example.env --platform "$os"
          done

  dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: update, saved-answers and tool-check tests
        run: node --test test/update.test.mjs test/answers.test.mjs test/tools.test.mjs
      - name: dry run (install.sh)
        if: runner.os != 'Windows'
        run: |
          ./update.sh --help
          ./install.sh --list
          ./install.sh --dry-run --yes --modules all --answers answers.example.env
      - name: dry run (install.ps1, PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./update.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./install.ps1 --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./install.ps1 --dry-run --yes --modules all --answers answers.example.env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: dry run (install.ps1, Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 --dry-run --yes --modules all --answers answers.example.env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
