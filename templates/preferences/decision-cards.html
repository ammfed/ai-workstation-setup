<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decisions</title>
<!--
  Decision-card page for lavish-axi, installed by ai-workstation-setup (preferences module).
  Copy this file next to your work, replace CARDS below, then run: lavish-axi --no-open <file>

  How it reads:
  - a small uppercase eyebrow, then a large title and one-line intro across the full page width;
  - a "Waiting on a click, not a decision" strip under the intro for things you only have to
    press (a merge, a sign-in), kept apart from real decisions;
  - one card at a time, labelled like "D-1 · 1 of 4", with a progress fill;
  - the canvas and the card sit side by side, never stacked (below 720px wide they stack);
  - the canvas shows the current card: every option gets a button, so you can flip between
    every option's preview, and the canvas follows the option you select;
  - a card with no options (a report, plan or explainer step) has a Next button instead;
  - a short "why" stays closed until opened;
  - answers are queued, shown in a one-screen recap, then sent together;
  - a banner says when no agent is listening (the page was opened without lavish-axi);
  - what is already decided sits below, collapsed.
  Keep text minimal: a title, one question, short option labels. No helper text, nothing obvious
  explained. Give every option a preview and let the previews carry the detail.

  Phones (below 720px): the card and its picture stack, the canvas loses its filler height, body
  text stays at 14px or more, a wide diagram shows its vertical version (previewsTall), and
  tapping a picture opens it full size.

  Visual rules for whoever fills in the cards:
  - Charts are bars or dots on one shared scale, never radar or gauges.
  - A rate reads as a natural frequency first ("3 of 10"), a percentage second if at all.
  - Every count toward a goal gets a visible fill, not bare text.
  - At most one headline number per card, read before the detail.
  - Meaning never rides on colour alone; a word or position carries it too.
  - No points, badges or leaderboards comparing people.
  - A range is stated in words, not left to a shaded band.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Roboto+Mono:wght@500&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EDEDED; --panel:#FFFFFF; --ink:#1B1D21; --ink-2:#232528; --muted:#5F646D; --line:#E1E3E5;
  --accent:#B68A35; --accent-ink:#92722A; --accent-deep:#7C5E24; --accent-soft:#F9F7ED; --on-accent:#FFFFFF;
  --ok:#2F663C; --ok-soft:#F3FAF4; --warn:#B2550B; --warn-soft:#FFFBEB;
  --radius:16px;
  --head:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Roboto",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16171A; --panel:#1F2125; --ink:#ECEEF1; --ink-2:#D9DCE0; --muted:#A0A5AD; --line:#33363C;
    --accent:#B68A35; --accent-ink:#D9B56A; --accent-deep:#E6C887; --accent-soft:#2B2618; --on-accent:#16171A;
    --ok:#7FD49A; --ok-soft:#1F3327; --warn:#F0A35E; --warn-soft:#3A3220; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding-block:32px}
.wrap{max-width:1680px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
header{width:100%}
h1,h2,.headline .num{font-family:var(--head);color:var(--ink)}
.eyebrow,.label,.progress,.rec,.tabs .picked,.waiting b{font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.eyebrow{font-size:13px;color:var(--accent-ink);margin:0 0 8px}
h1{font-size:clamp(34px,4vw,52px);font-weight:800;line-height:1.1;letter-spacing:-.02em;margin:0}
.lede{font-size:clamp(17px,1.5vw,21px);color:var(--muted);margin:10px 0 0}
.waiting{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-top:18px}
.waiting b{font-size:12px}
.waiting ul{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;margin:0;padding:0;color:var(--ink-2)}
.waiting li::before{content:"○ ";color:var(--warn)}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin:14px 0}
.progress{display:flex;justify-content:flex-end;color:var(--muted);font-size:13px;margin-top:22px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-width:0}
.canvas{min-height:460px;display:flex;flex-direction:column;gap:14px}
.canvas h2{font-size:24px;font-weight:700;margin:0}
.canvas .stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;cursor:zoom-in}
.canvas .stage.empty{cursor:default}
.stage .wide,.stage .tall{width:100%}
.canvas svg,.canvas img{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.stage .tall{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
.tabs .picked{font-size:11px;color:var(--ok);margin-left:6px}
.stage .none{font-size:22px;color:var(--muted)}
.label{font-size:12px;color:var(--accent-ink);margin:0}
.card h2{font-size:22px;font-weight:700;line-height:1.25;margin:6px 0 6px}
.card .body{color:var(--ink-2);margin:8px 0 0}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opts label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opts input{accent-color:var(--accent)}
.rec{font-size:11px;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:2px 7px;margin-left:auto;white-space:nowrap}
details{border-top:1px solid var(--line);padding-top:8px;color:var(--muted)}
summary{cursor:pointer;color:var(--ink);font-weight:500}
textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:12px;background:var(--panel);color:var(--ink)}
button.primary{font:inherit;font-weight:500;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:10px 18px;margin-top:12px;cursor:pointer}
button.primary:disabled{opacity:.4;cursor:not-allowed}
.recap li{margin:4px 0}
.headline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:6px 0}
.headline .num{font-size:40px;font-weight:800;line-height:1;color:var(--accent-deep);white-space:nowrap}
.headline .cap{color:var(--muted)}
.evidence{background:var(--accent-soft);border-radius:12px;padding:8px 12px;margin:10px 0 0;font-size:15px}
.decided{margin-top:22px}
.decided summary{font-family:var(--head);font-weight:600}
.decided table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.decided td{padding:6px 8px;border-top:1px solid var(--line);color:var(--ink)}
dialog.zoom{border:0;border-radius:var(--radius);padding:16px;background:var(--panel);color:var(--ink);width:min(96vw,1400px);max-height:94vh;overflow:auto}
dialog.zoom::backdrop{background:rgba(0,0,0,.6)}
dialog.zoom svg,dialog.zoom img{width:100%;height:auto}
dialog.zoom button{position:sticky;top:0;float:right;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
@media (max-width:719px){
  body{padding-block:20px}
  .main{grid-template-columns:1fr}
  .canvas{min-height:0}
  .panel{padding:18px}
  .tabs button,textarea,.decided table,.evidence{font-size:14px}
  .rec,.tabs .picked,.label{font-size:12px}
  .stage .tall{display:block}
  .stage .tall + .wide{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Review</p>
    <h1>Decisions</h1>
    <p class="lede">Weekly report: pick a layout and a chart style.</p>
  </header>
  <div class="waiting" id="waiting" hidden><b>Waiting on a click, not a decision</b><ul id="waiting-items"></ul></div>
  <div class="banner" id="banner" hidden>No agent is listening. Open this page with lavish-axi to send your answers.</div>
  <div class="progress"><span id="count"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="main">
    <section class="panel canvas" id="canvas" aria-live="polite"></section>
    <aside class="panel card" id="card"></aside>
  </div>
  <details class="decided" id="decided" hidden><summary>Decided so far</summary><table id="decided-rows"></table></details>
</div>
<dialog class="zoom" id="zoom" aria-label="Full-size picture"><button type="button" id="zoom-close">Close</button><div id="zoom-body"></div></dialog>
<script>
// Each card: id, title, question, optional label (such as 'D-1'), options [[value, label]],
// optional rec (recommended value), optional why (short HTML, shown closed),
// previews { value: HTML or inline SVG }, one per option, optional previewsTall { value: ... }
// with a vertical version of a wide diagram for phones, optional headline { num: '3 of 5',
// cap: 'checks passing' } shown before the options, optional evidence: one sentence shown
// above "Why". A card without options is a content card: give it body (short HTML) and
// preview (one visual); it gets a Next button.
const lines = (x, y, n, w) => Array.from({ length: n }, (_, i) => `<rect x="${x}" y="${y + i * 22}" width="${w}" height="8" rx="4" fill="currentColor" opacity=".25"/>`).join('');
const onePage = `<svg viewBox="0 0 320 220" role="img" aria-label="One page with a summary table">
  <rect x="1" y="1" width="318" height="218" rx="10" fill="none" stroke="currentColor" opacity=".3"/>
  <rect x="20" y="20" width="140" height="14" rx="4" fill="currentColor" opacity=".8"/>
  <rect x="20" y="50" width="280" height="150" rx="6" fill="none" stroke="currentColor" opacity=".4"/>
  <line x1="113" y1="50" x2="113" y2="200" stroke="currentColor" opacity=".3"/><line x1="206" y1="50" x2="206" y2="200" stroke="currentColor" opacity=".3"/>
  ${lines(30, 66, 6, 70)}${lines(123, 66, 6, 70)}${lines(216, 66, 6, 70)}</svg>`;
const sections = `<svg viewBox="0 0 320 220" role="img" aria-label="A section per area">
  <rect x="1" y="1" width="318" height="218" rx="10" fill="none" stroke="currentColor" opacity=".3"/>
  ${[20, 90, 160].map((y) => `<rect x="20" y="${y}" width="110" height="12" rx="4" fill="currentColor" opacity=".8"/>${lines(20, y + 22, 2, 280)}`).join('')}</svg>`;
const bars = (a, b) => `<svg viewBox="0 0 320 120" role="img" aria-label="${a} of 10 against ${b} of 10">
  <rect x="0" y="20" width="${a * 30}" height="30" rx="6" fill="currentColor" opacity=".85"/><text x="${a * 30 + 8}" y="41" fill="currentColor">${a} of 10</text>
  <rect x="0" y="70" width="${b * 30}" height="30" rx="6" fill="currentColor" opacity=".35"/><text x="${b * 30 + 8}" y="91" fill="currentColor">${b} of 10</text></svg>`;
const CARDS = [
  {
    id: 'layout', label: 'D-1', title: 'Report layout', question: 'Which layout should the weekly report use?',
    options: [['one-page', 'One page with a summary table'], ['sections', 'A section per area']],
    rec: 'one-page',
    headline: { num: '2 of 3', cap: 'readers stop after the first screen' },
    evidence: 'The summary table answers the first question without scrolling.',
    why: 'Most readers stop after the first screen, so the summary goes first.',
    previews: { 'one-page': onePage, sections },
  },
  {
    id: 'chart', label: 'D-2', title: 'Chart style', question: 'Bars or a table for the weekly numbers?',
    options: [['bars', 'Bars on one scale'], ['table', 'Table only']],
    rec: 'bars',
    previews: {
      bars: bars(8, 5),
      table: `<svg viewBox="0 0 320 120" role="img" aria-label="Table of the weekly numbers">
        <rect x="1" y="1" width="318" height="118" rx="8" fill="none" stroke="currentColor" opacity=".4"/><line x1="1" y1="60" x2="319" y2="60" stroke="currentColor" opacity=".3"/><line x1="200" y1="1" x2="200" y2="119" stroke="currentColor" opacity=".3"/>
        <text x="16" y="36" fill="currentColor">This week</text><text x="216" y="36" fill="currentColor">8 of 10</text>
        <text x="16" y="96" fill="currentColor">Last week</text><text x="216" y="96" fill="currentColor">5 of 10</text></svg>`,
    },
  },
];

// Things the user only has to press, shown in the strip under the intro. Empty hides it.
const WAITING = [
  'Merge the pull request once checks pass',
];

// Already decided, shown collapsed under the cards: [topic, decision, date].
const DECIDED = [
  ['Report cadence', 'Weekly, sent on Friday', '1 Sep'],
];

const answers = [];
let index = 0;
let shown = {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const decisions = () => CARDS.filter((c) => c.options?.length);

// lavish-axi injects window.lavish after the page script can already have run, so decide the
// banner once the page has settled, and again whenever answers are sent.
const checkListening = () => { $('banner').hidden = Boolean(window.lavish); };
window.addEventListener('load', () => setTimeout(checkListening, 1500));

if (WAITING.length) {
  $('waiting').hidden = false;
  $('waiting-items').innerHTML = WAITING.map((w) => `<li>${esc(w)}</li>`).join('');
}

if (DECIDED.length) {
  $('decided').hidden = false;
  $('decided-rows').innerHTML = DECIDED.map((row) => `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join('')}</tr>`).join('');
}

// A picture opens full size on tap; the vertical version stays for phones.
$('zoom-close').addEventListener('click', () => $('zoom').close());
$('zoom').addEventListener('click', (e) => { if (e.target === $('zoom')) $('zoom').close(); });
function zoom(stage) {
  const pic = stage.querySelector('.wide') || stage;
  if (!pic.querySelector('svg,img')) return;
  $('zoom-body').innerHTML = pic.innerHTML;
  $('zoom').showModal();
}

function picked() {
  return document.querySelector('#card input[type=radio]:checked')?.value;
}

function stageHtml(wide, tall) {
  return `${tall ? `<div class="tall">${tall}</div>` : ''}<div class="wide">${wide}</div>`;
}

function drawCanvas() {
  const c = CARDS[index];
  const el = $('canvas');
  if (!c) { el.innerHTML = '<div class="stage empty"><h2>All answered</h2></div>'; return; }
  if (!c.options?.length) {
    el.innerHTML = `<h2>${esc(c.title)}</h2><div class="stage${c.preview ? '' : ' empty'}">${stageHtml(c.preview || '', c.previewTall)}</div>`;
  } else {
    const chosen = picked();
    const current = shown[c.id] || chosen || c.rec || c.options[0][0];
    const label = c.options.find(([v]) => v === current)[1];
    const tabs = c.options.map(([v, l]) => `<button type="button" aria-pressed="${v === current}" data-v="${esc(v)}">${esc(l)}${v === chosen ? '<span class="picked">Picked</span>' : ''}</button>`).join('');
    const preview = c.previews?.[current];
    const stage = preview ? `<div class="stage">${stageHtml(preview, c.previewsTall?.[current])}</div>` : `<div class="stage empty"><span class="none">${esc(label)}</span></div>`;
    el.innerHTML = `<h2>${esc(c.title)}</h2><div class="tabs" role="group" aria-label="Option previews">${tabs}</div>${stage}`;
    el.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { shown[c.id] = b.dataset.v; drawCanvas(); }));
  }
  const stage = el.querySelector('.stage:not(.empty)');
  stage?.addEventListener('click', () => zoom(stage));
}

function drawCard() {
  const n = Math.min(index + 1, CARDS.length);
  $('count').textContent = `${n} of ${CARDS.length}`;
  $('fill').style.width = `${(100 * index) / CARDS.length}%`;
  const c = CARDS[index];
  if (!c) return drawRecap();
  const label = `<p class="label">${c.label ? `${esc(c.label)} · ` : ''}${n} of ${CARDS.length}</p>`;
  const advance = () => { index += 1; drawCard(); };
  if (!c.options?.length) {
    $('card').innerHTML = `${label}<h2>${esc(c.question || c.title)}</h2>
      ${c.headline ? `<div class="headline"><span class="num">${esc(c.headline.num)}</span><span class="cap">${esc(c.headline.cap)}</span></div>` : ''}
      ${c.body ? `<div class="body">${c.body}</div>` : ''}
      ${c.evidence ? `<p class="evidence">${esc(c.evidence)}</p>` : ''}
      ${c.why ? `<details><summary>Why</summary><p>${c.why}</p></details>` : ''}
      <button type="button" class="primary" id="next">Next</button>`;
    $('next').addEventListener('click', advance);
    drawCanvas();
    return;
  }
  $('card').innerHTML = `${label}<h2>${esc(c.question)}</h2>
    ${c.headline ? `<div class="headline"><span class="num">${esc(c.headline.num)}</span><span class="cap">${esc(c.headline.cap)}</span></div>` : ''}
    <div class="opts">${c.options.map(([v, l]) => `<label><input type="radio" name="opt" value="${esc(v)}"><span>${esc(l)}</span>${v === c.rec ? '<span class="rec">Recommended</span>' : ''}</label>`).join('')}</div>
    ${c.evidence ? `<p class="evidence">${esc(c.evidence)}</p>` : ''}
    ${c.why ? `<details><summary>Why</summary><p>${c.why}</p></details>` : ''}
    <textarea id="note" rows="2" placeholder="Note"></textarea>
    <button type="button" class="primary" id="next" disabled>Next</button>`;
  $('card').querySelectorAll('input[type=radio]').forEach((r) => r.addEventListener('change', () => {
    $('next').disabled = false;
    shown[c.id] = r.value;
    drawCanvas();
  }));
  $('next').addEventListener('click', () => {
    const value = picked();
    answers.push({ id: c.id, title: c.title, value, label: c.options.find(([v]) => v === value)[1], note: $('note').value.trim() });
    advance();
  });
  drawCanvas();
}

function drawRecap() {
  drawCanvas();
  if (!decisions().length) {
    $('card').innerHTML = '<h2>That is everything</h2>';
    return;
  }
  $('card').innerHTML = `<h2>Your answers</h2>
    <ul class="recap">${answers.map((a) => `<li><b>${esc(a.title)}:</b> ${esc(a.label)}${a.note ? ` (${esc(a.note)})` : ''}</li>`).join('')}</ul>
    <button type="button" class="primary" id="back">Change the last answer</button>
    <button type="button" class="primary" id="send">Send answers</button>`;
  $('back').addEventListener('click', () => {
    // Step back over content cards to the last decision answered.
    const last = answers.pop();
    index = CARDS.findIndex((c) => c.id === last.id);
    drawCard();
  });
  $('send').addEventListener('click', () => {
    checkListening();
    for (const a of answers) {
      window.lavish?.queuePrompt?.(`${a.title}: ${a.label}.${a.note ? ` Note: ${a.note}` : ''}`, { tag: 'decision', queueKey: a.id, data: a });
    }
    window.lavish?.sendQueuedPrompts?.();
    $('send').disabled = true;
    $('send').textContent = window.lavish ? 'Sent' : 'Not sent: no agent is listening';
  });
}

drawCard();
</script>
</body>
</html>
