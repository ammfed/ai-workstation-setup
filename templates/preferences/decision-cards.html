<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decisions</title>
<!--
  Decision-card page for lavish-axi, installed by ai-workstation-setup (preferences module).
  Copy this file next to your work, replace CARDS below, then run: lavish-axi --no-open <file>

  How it reads:
  - a large title and one-line intro spread across the full page width;
  - one decision at a time, "1 of N" with a progress fill;
  - the canvas and the card sit side by side, never stacked (only a phone-width screen stacks them);
  - the canvas shows the current decision: every option gets a button, so you can flip between
    every option's preview, and the canvas follows the option you select;
  - a short "why" stays closed until opened;
  - answers are queued, shown in a one-screen recap, then sent together;
  - a banner says when no agent is listening (the page was opened without lavish-axi);
  - what is already decided sits below, collapsed.
  Keep text minimal: a title, one question, short option labels. No helper text, nothing obvious
  explained. Give every option a preview and let the previews carry the detail.

  Visual rules for whoever fills in the cards:
  - Charts are bars or dots on one shared scale, never radar or gauges.
  - A rate reads as a natural frequency first ("3 of 10"), a percentage second if at all.
  - Every count toward a goal gets a visible fill, not bare text.
  - At most one headline number per card, read before the detail.
  - Meaning never rides on colour alone; a word or position carries it too.
  - No points, badges or leaderboards comparing people.
  - A range is stated in words, not left to a shaded band.
-->
<style>
:root{
  --bg:#f4f4f2; --panel:#fff; --ink:#1d1f23; --muted:#62666d; --line:#e2e3e5;
  --accent:#3558d6; --accent-soft:#eef1fc; --ok:#256b3a; --ok-soft:#eaf6ee; --warn-soft:#fff6e0;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16171a; --panel:#1f2125; --ink:#eceef1; --muted:#a0a5ad; --line:#33363c;
    --accent:#8aa2ff; --accent-soft:#262c45; --ok:#7fd49a; --ok-soft:#1f3327; --warn-soft:#3a3220; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding-block:32px}
.wrap{max-width:1680px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
header{width:100%}
h1{font-size:clamp(34px,4vw,52px);line-height:1.1;letter-spacing:-.01em;margin:0}
.lede{font-size:clamp(18px,1.6vw,22px);color:var(--muted);margin:10px 0 0}
.banner{background:var(--warn-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:14px 0}
.progress{display:flex;justify-content:flex-end;color:var(--muted);font-size:15px;margin-top:22px}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:16px}
@media (max-width:600px){.main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-width:0}
.canvas{min-height:460px;display:flex;flex-direction:column;gap:14px}
.canvas h2{font-size:24px;margin:0}
.canvas .stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.canvas svg{max-width:100%;height:auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tabs .picked{font-size:12px;font-weight:600;color:var(--ok);margin-left:6px}
.stage .none{font-size:22px;color:var(--muted)}
.card h2{font-size:22px;margin:2px 0 6px}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opts label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.rec{font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:1px 7px;margin-left:auto}
details{border-top:1px solid var(--line);padding-top:8px;color:var(--muted)}
summary{cursor:pointer;color:var(--ink);font-weight:600}
textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:12px;background:var(--panel);color:var(--ink)}
button.primary{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;margin-top:12px;cursor:pointer}
button.primary:disabled{opacity:.4;cursor:not-allowed}
.recap li{margin:4px 0}
.headline{display:flex;align-items:baseline;gap:10px;margin:6px 0}
.headline .num{font-size:40px;font-weight:800;line-height:1}
.headline .cap{color:var(--muted)}
.evidence{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:10px 0 0;font-size:15px}
.decided{margin-top:22px}
.decided table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.decided td{padding:6px 8px;border-top:1px solid var(--line);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Decisions</h1>
    <p class="lede">Weekly report: pick a layout and a chart style.</p>
  </header>
  <div class="banner" id="banner" hidden>No agent is listening. Open this page with lavish-axi to send your answers.</div>
  <div class="progress"><b id="count"></b></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="main">
    <section class="panel canvas" id="canvas" aria-live="polite"></section>
    <aside class="panel card" id="card"></aside>
  </div>
  <details class="decided" id="decided" hidden><summary>Decided so far</summary><table id="decided-rows"></table></details>
</div>
<script>
// Each card: id, title, question, options [[value, label]], optional rec (recommended value),
// optional why (short HTML, shown closed), previews { value: HTML or inline SVG }, one per option,
// optional headline { num: '3 of 5', cap: 'checks passing' } shown before the options,
// optional evidence: one sentence shown above "Why".
const lines = (x, y, n, w) => Array.from({ length: n }, (_, i) => `<rect x="${x}" y="${y + i * 22}" width="${w}" height="8" rx="4" fill="currentColor" opacity=".25"/>`).join('');
const onePage = `<svg viewBox="0 0 320 220" role="img" aria-label="One page with a summary table">
  <rect x="1" y="1" width="318" height="218" rx="10" fill="none" stroke="currentColor" opacity=".3"/>
  <rect x="20" y="20" width="140" height="14" rx="4" fill="currentColor" opacity=".8"/>
  <rect x="20" y="50" width="280" height="150" rx="6" fill="none" stroke="currentColor" opacity=".4"/>
  <line x1="113" y1="50" x2="113" y2="200" stroke="currentColor" opacity=".3"/><line x1="206" y1="50" x2="206" y2="200" stroke="currentColor" opacity=".3"/>
  ${lines(30, 66, 6, 70)}${lines(123, 66, 6, 70)}${lines(216, 66, 6, 70)}</svg>`;
const sections = `<svg viewBox="0 0 320 220" role="img" aria-label="A section per area">
  <rect x="1" y="1" width="318" height="218" rx="10" fill="none" stroke="currentColor" opacity=".3"/>
  ${[20, 90, 160].map((y) => `<rect x="20" y="${y}" width="110" height="12" rx="4" fill="currentColor" opacity=".8"/>${lines(20, y + 22, 2, 280)}`).join('')}</svg>`;
const bars = (a, b) => `<svg viewBox="0 0 320 120" role="img" aria-label="${a} of 10 against ${b} of 10">
  <rect x="0" y="20" width="${a * 30}" height="30" rx="6" fill="currentColor" opacity=".85"/><text x="${a * 30 + 8}" y="41" fill="currentColor">${a} of 10</text>
  <rect x="0" y="70" width="${b * 30}" height="30" rx="6" fill="currentColor" opacity=".35"/><text x="${b * 30 + 8}" y="91" fill="currentColor">${b} of 10</text></svg>`;
const CARDS = [
  {
    id: 'layout', title: 'Report layout', question: 'Which layout should the weekly report use?',
    options: [['one-page', 'One page with a summary table'], ['sections', 'A section per area']],
    rec: 'one-page',
    headline: { num: '2 of 3', cap: 'readers stop after the first screen' },
    evidence: 'The summary table answers the first question without scrolling.',
    why: 'Most readers stop after the first screen, so the summary goes first.',
    previews: { 'one-page': onePage, sections },
  },
  {
    id: 'chart', title: 'Chart style', question: 'Bars or a table for the weekly numbers?',
    options: [['bars', 'Bars on one scale'], ['table', 'Table only']],
    rec: 'bars',
    previews: {
      bars: bars(8, 5),
      table: `<svg viewBox="0 0 320 120" role="img" aria-label="Table of the weekly numbers">
        <rect x="1" y="1" width="318" height="118" rx="8" fill="none" stroke="currentColor" opacity=".4"/><line x1="1" y1="60" x2="319" y2="60" stroke="currentColor" opacity=".3"/><line x1="200" y1="1" x2="200" y2="119" stroke="currentColor" opacity=".3"/>
        <text x="16" y="36" fill="currentColor">This week</text><text x="216" y="36" fill="currentColor">8 of 10</text>
        <text x="16" y="96" fill="currentColor">Last week</text><text x="216" y="96" fill="currentColor">5 of 10</text></svg>`,
    },
  },
];

// Already decided, shown collapsed under the cards: [topic, decision, date].
const DECIDED = [
  ['Report cadence', 'Weekly, sent on Friday', '1 Sep'],
];

const answers = [];
let index = 0;
let shown = {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// lavish-axi injects window.lavish after the page script can already have run, so decide the
// banner once the page has settled, and again whenever answers are sent.
const checkListening = () => { $('banner').hidden = Boolean(window.lavish); };
window.addEventListener('load', () => setTimeout(checkListening, 1500));

if (DECIDED.length) {
  $('decided').hidden = false;
  $('decided-rows').innerHTML = DECIDED.map((row) => `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join('')}</tr>`).join('');
}

function picked() {
  return document.querySelector('#card input[type=radio]:checked')?.value;
}

function drawCanvas() {
  const c = CARDS[index];
  const el = $('canvas');
  if (!c) { el.innerHTML = '<div class="stage"><h2>All answered</h2></div>'; return; }
  const chosen = picked();
  const current = shown[c.id] || chosen || c.rec || c.options[0][0];
  const label = c.options.find(([v]) => v === current)[1];
  const tabs = c.options.map(([v, l]) => `<button type="button" aria-pressed="${v === current}" data-v="${esc(v)}">${esc(l)}${v === chosen ? '<span class="picked">Picked</span>' : ''}</button>`).join('');
  const preview = c.previews?.[current] || `<span class="none">${esc(label)}</span>`;
  el.innerHTML = `<h2>${esc(c.title)}</h2><div class="tabs" role="group" aria-label="Option previews">${tabs}</div><div class="stage">${preview}</div>`;
  el.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { shown[c.id] = b.dataset.v; drawCanvas(); }));
}

function drawCard() {
  $('count').textContent = `${Math.min(index + 1, CARDS.length)} of ${CARDS.length}`;
  $('fill').style.width = `${(100 * index) / CARDS.length}%`;
  const c = CARDS[index];
  if (!c) return drawRecap();
  $('card').innerHTML = `<h2>${esc(c.question)}</h2>
    ${c.headline ? `<div class="headline"><span class="num">${esc(c.headline.num)}</span><span class="cap">${esc(c.headline.cap)}</span></div>` : ''}
    <div class="opts">${c.options.map(([v, l]) => `<label><input type="radio" name="opt" value="${esc(v)}"><span>${esc(l)}</span>${v === c.rec ? '<span class="rec">Recommended</span>' : ''}</label>`).join('')}</div>
    ${c.evidence ? `<p class="evidence">${esc(c.evidence)}</p>` : ''}
    ${c.why ? `<details><summary>Why</summary><p>${c.why}</p></details>` : ''}
    <textarea id="note" rows="2" placeholder="Note"></textarea>
    <button type="button" class="primary" id="next" disabled>Next</button>`;
  $('card').querySelectorAll('input[type=radio]').forEach((r) => r.addEventListener('change', () => {
    $('next').disabled = false;
    shown[c.id] = r.value;
    drawCanvas();
  }));
  $('next').addEventListener('click', () => {
    const value = picked();
    answers.push({ id: c.id, title: c.title, value, label: c.options.find(([v]) => v === value)[1], note: $('note').value.trim() });
    index += 1;
    drawCard();
  });
  drawCanvas();
}

function drawRecap() {
  drawCanvas();
  $('card').innerHTML = `<h2>Your answers</h2>
    <ul class="recap">${answers.map((a) => `<li><b>${esc(a.title)}:</b> ${esc(a.label)}${a.note ? ` (${esc(a.note)})` : ''}</li>`).join('')}</ul>
    <button type="button" class="primary" id="back">Change the last answer</button>
    <button type="button" class="primary" id="send">Send answers</button>`;
  $('back').addEventListener('click', () => { answers.pop(); index -= 1; drawCard(); });
  $('send').addEventListener('click', () => {
    checkListening();
    for (const a of answers) {
      window.lavish?.queuePrompt?.(`${a.title}: ${a.label}.${a.note ? ` Note: ${a.note}` : ''}`, { tag: 'decision', queueKey: a.id, data: a });
    }
    window.lavish?.sendQueuedPrompts?.();
    $('send').disabled = true;
    $('send').textContent = window.lavish ? 'Sent' : 'Not sent: no agent is listening';
  });
}

drawCard();
</script>
</body>
</html>
