<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decisions</title>
<!--
  Decision-card page for lavish-axi, installed by ai-workstation-setup (preferences module).
  Copy this file next to your work, replace CARDS below, then run: lavish-axi --no-open <file>

  How it reads:
  - one decision at a time, "1 of N" with a progress fill;
  - a canvas beside the card shows the current decision; for a visual choice every option gets
    a preview, with buttons to flip between them, and the canvas follows the option you select;
  - a short "why" stays closed until opened;
  - answers are queued, shown in a one-screen recap, then sent together;
  - a banner says when no agent is listening (the page was opened without lavish-axi).
  Keep text minimal: a title, one question, short option labels. Let previews carry the detail.
-->
<style>
:root{
  --bg:#f4f4f2; --panel:#fff; --ink:#1d1f23; --muted:#62666d; --line:#e2e3e5;
  --accent:#3558d6; --accent-soft:#eef1fc; --ok:#256b3a; --ok-soft:#eaf6ee; --warn-soft:#fff6e0;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16171a; --panel:#1f2125; --ink:#eceef1; --muted:#a0a5ad; --line:#33363c;
    --accent:#8aa2ff; --accent-soft:#262c45; --ok:#7fd49a; --ok-soft:#1f3327; --warn-soft:#3a3220; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding-block:28px}
.wrap{max-width:1500px;margin:0 auto;padding-inline:24px}
h1{font-size:32px;margin:0 0 4px}
.banner{background:var(--warn-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:14px 0}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:16px}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:16px}
@media (max-width:760px){.main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-width:0}
.canvas{min-height:420px;display:flex;flex-direction:column;gap:14px}
.canvas .stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.canvas svg{max-width:100%;height:auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.eyebrow{color:var(--muted);font-size:13px}
.card h2{font-size:22px;margin:2px 0 6px}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opts label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.rec{font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:1px 7px;margin-left:auto}
details{border-top:1px solid var(--line);padding-top:8px;color:var(--muted)}
summary{cursor:pointer;color:var(--ink);font-weight:600}
textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:12px;background:var(--panel);color:var(--ink)}
button.primary{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;margin-top:12px;cursor:pointer}
button.primary:disabled{opacity:.4;cursor:not-allowed}
.recap li{margin:4px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Decisions</h1>
  <div class="banner" id="banner" hidden>No agent is listening. Open this page with lavish-axi to send your answers.</div>
  <div class="progress"><span>Open decisions</span><b id="count"></b></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="main">
    <section class="panel canvas" id="canvas" aria-live="polite"></section>
    <aside class="panel card" id="card"></aside>
  </div>
</div>
<script>
// Each card: id, title, question, options [[value, label]], optional rec (recommended value),
// optional why (short HTML, shown closed), optional previews { value: HTML or inline SVG }.
const bars = (a, b) => `<svg viewBox="0 0 320 120" role="img" aria-label="${a} of 10 against ${b} of 10">
  <rect x="0" y="20" width="${a * 30}" height="30" rx="6" fill="currentColor" opacity=".85"/><text x="${a * 30 + 8}" y="41" fill="currentColor">${a} of 10</text>
  <rect x="0" y="70" width="${b * 30}" height="30" rx="6" fill="currentColor" opacity=".35"/><text x="${b * 30 + 8}" y="91" fill="currentColor">${b} of 10</text></svg>`;
const CARDS = [
  {
    id: 'layout', title: 'Report layout', question: 'Which layout should the weekly report use?',
    options: [['one-page', 'One page with a summary table'], ['sections', 'A section per area']],
    rec: 'one-page',
    why: 'Most readers stop after the first screen, so the summary goes first.',
    previews: {
      'one-page': '<p>One table: item, state, next step.</p>',
      'sections': '<p>One heading per area, each with progress and next steps.</p>',
    },
  },
  {
    id: 'chart', title: 'Chart style', question: 'Bars or a table for the weekly numbers?',
    options: [['bars', 'Bars on one scale'], ['table', 'Table only']],
    rec: 'bars',
    previews: { bars: bars(8, 5), table: '<p>8 of 10 done this week, 5 of 10 last week.</p>' },
  },
];

const answers = [];
let index = 0;
let shown = {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

if (!window.lavish) $('banner').hidden = false;

function picked() {
  return document.querySelector('#card input[type=radio]:checked')?.value;
}

function drawCanvas() {
  const c = CARDS[index];
  const el = $('canvas');
  if (!c) { el.innerHTML = '<div class="stage"><h2>All answered</h2></div>'; return; }
  const withPreview = c.options.filter(([v]) => c.previews?.[v]);
  if (!withPreview.length) { el.innerHTML = `<span class="eyebrow">${index + 1} of ${CARDS.length}</span><div class="stage"><h2>${esc(c.title)}</h2></div>`; return; }
  const current = shown[c.id] || picked() || c.rec || withPreview[0][0];
  const tabs = withPreview.map(([v, l]) => `<button type="button" aria-pressed="${v === current}" data-v="${esc(v)}">${esc(l)}</button>`).join('');
  el.innerHTML = `<span class="eyebrow">${index + 1} of ${CARDS.length}</span><div class="tabs">${tabs}</div><div class="stage">${c.previews[current]}</div>`;
  el.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { shown[c.id] = b.dataset.v; drawCanvas(); }));
}

function drawCard() {
  $('count').textContent = `${Math.min(index, CARDS.length)} of ${CARDS.length}`;
  $('fill').style.width = `${(100 * index) / CARDS.length}%`;
  const c = CARDS[index];
  if (!c) return drawRecap();
  $('card').innerHTML = `<span class="eyebrow">${index + 1} of ${CARDS.length}</span>
    <h2>${esc(c.title)}</h2><div>${esc(c.question)}</div>
    <div class="opts">${c.options.map(([v, l]) => `<label><input type="radio" name="opt" value="${esc(v)}"><span>${esc(l)}</span>${v === c.rec ? '<span class="rec">Recommended</span>' : ''}</label>`).join('')}</div>
    ${c.why ? `<details><summary>Why</summary><p>${c.why}</p></details>` : ''}
    <textarea id="note" rows="2" placeholder="Note (optional)"></textarea>
    <button type="button" class="primary" id="next" disabled>Next</button>`;
  $('card').querySelectorAll('input[type=radio]').forEach((r) => r.addEventListener('change', () => {
    $('next').disabled = false;
    shown[c.id] = r.value;
    drawCanvas();
  }));
  $('next').addEventListener('click', () => {
    const value = picked();
    answers.push({ id: c.id, title: c.title, value, label: c.options.find(([v]) => v === value)[1], note: $('note').value.trim() });
    index += 1;
    drawCard();
  });
  drawCanvas();
}

function drawRecap() {
  drawCanvas();
  $('card').innerHTML = `<h2>Your answers</h2>
    <ul class="recap">${answers.map((a) => `<li><b>${esc(a.title)}:</b> ${esc(a.label)}${a.note ? ` (${esc(a.note)})` : ''}</li>`).join('')}</ul>
    <button type="button" class="primary" id="back">Change the last answer</button>
    <button type="button" class="primary" id="send">Send answers</button>`;
  $('back').addEventListener('click', () => { answers.pop(); index -= 1; drawCard(); });
  $('send').addEventListener('click', () => {
    for (const a of answers) {
      window.lavish?.queuePrompt?.(`${a.title}: ${a.label}.${a.note ? ` Note: ${a.note}` : ''}`, { tag: 'decision', queueKey: a.id, data: a });
    }
    window.lavish?.sendQueuedPrompts?.();
    $('send').disabled = true;
    $('send').textContent = window.lavish ? 'Sent' : 'Not sent: no agent is listening';
  });
}

drawCard();
</script>
</body>
</html>
