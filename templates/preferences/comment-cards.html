<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review</title>
<!--
  Comment-card page, installed by ai-workstation-setup (preferences module) next to
  decision-cards.html. Use it only for a page meant for invited colleagues, published as a private
  Claude artifact. The owner's own review pages stay on Lavish with decision-cards.html.

  Copy this file, replace CARDS (and DECIDED) below, and keep each card's id stable between
  versions: every card renders as <section id="card-<id>">, so a comment thread stays on the
  card it was left on when the page is published again.

  How it differs from decision-cards.html:
  - every card is on one page, top to bottom, so a colleague can read and comment in any order;
  - there are no answer buttons and no Lavish send controls. Each card ends with a short line
    that asks for a comment on that card (the card's `ask` field, or a default);
  - options are listed, with the recommended one marked, and a button per option flips the
    picture beside the card;
  - it needs no Lavish runtime and loads nothing but Google Fonts, so it renders on its own.

  The card fields are the same as in decision-cards.html (id, title, question, label, options,
  rec, previews, previewsTall, preview, previewTall, headline, body, evidence, why, based), plus
  an optional `ask`. Keep text minimal and let the previews carry the detail. Light by default;
  a small "Dark" button switches to dark and the choice is remembered (localStorage, guarded).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Roboto+Mono:wght@500&family=Roboto:wght@400;500;700&display=swap">
<script>
// Set the theme before first paint so a dark choice does not flash light. Storage can be blocked.
(function () {
  try { if (localStorage.getItem('comment-cards-theme:' + location.pathname) === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#EDEDED; --panel:#FFFFFF; --ink:#1B1D21; --ink-2:#232528; --muted:#5F646D; --line:#E1E3E5;
  --accent:#B68A35; --accent-ink:#92722A; --accent-deep:#7C5E24; --accent-soft:#F9F7ED; --on-accent:#FFFFFF;
  --ok:#2F663C; --ok-soft:#F3FAF4; --warn:#B2550B; --warn-soft:#FFFBEB;
  --radius:16px;
  --head:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Roboto",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#16171A; --panel:#1F2125; --ink:#ECEEF1; --ink-2:#D9DCE0; --muted:#A0A5AD; --line:#33363C;
    --accent:#B68A35; --accent-ink:#D9B56A; --accent-deep:#E6C887; --accent-soft:#2B2618; --on-accent:#16171A;
    --ok:#7FD49A; --ok-soft:#1F3327; --warn:#F0A35E; --warn-soft:#3A3220; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding-block:32px}
.wrap{max-width:1680px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
.themebar{display:flex;justify-content:flex-end;margin-bottom:10px}
.theme,.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.theme[aria-pressed="true"],.tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
.theme:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,.headline .num{font-family:var(--head);color:var(--ink)}
.eyebrow,.label,.rec{font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.eyebrow{font-size:13px;color:var(--accent-deep);margin:0 0 8px}
h1{font-size:clamp(34px,4vw,52px);font-weight:800;line-height:1.1;letter-spacing:-.02em;margin:0}
.lede{font-size:clamp(17px,1.5vw,21px);color:var(--muted);margin:10px 0 0}
.item{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:24px;scroll-margin-top:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-width:0}
.canvas{min-height:340px;display:flex;flex-direction:column;gap:14px}
.canvas h2{font-size:24px;font-weight:700;margin:0}
.canvas .stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.stage .wide,.stage .tall{width:100%}
.stage .tall{display:none}
.canvas svg,.canvas img{display:block;width:100%;max-width:680px;height:auto;margin:0 auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{padding:5px 12px}
.label{font-size:12px;color:var(--accent-ink);margin:0}
.card h2{font-size:22px;font-weight:700;line-height:1.25;margin:6px 0 6px}
.card .body{color:var(--ink-2);margin:8px 0 0}
.opts{list-style:none;display:flex;flex-direction:column;gap:8px;margin:14px 0;padding:0}
.opts li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.opts li.is-rec{border-color:var(--accent);background:var(--accent-soft)}
.rec{font-size:11px;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:2px 7px;margin-left:auto;white-space:nowrap}
.headline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:6px 0}
.headline .num{font-size:40px;font-weight:800;line-height:1;color:var(--accent-deep);white-space:nowrap}
.headline .cap{color:var(--muted)}
.evidence{background:var(--accent-soft);border-radius:12px;padding:8px 12px;margin:10px 0 0;font-size:15px}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:12px;color:var(--muted)}
summary{cursor:pointer;color:var(--ink);font-weight:500}
.ask{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:16px 0 0;color:var(--ink);font-weight:500}
.based{color:var(--muted);font-size:14px;margin:12px 0 0}
.decided{margin-top:24px}
.decided summary{font-family:var(--head);font-weight:600}
.decided table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.decided td{padding:6px 8px;border-top:1px solid var(--line);color:var(--ink)}
@media (max-width:719px){
  body{padding-block:20px}
  .item{grid-template-columns:1fr}
  .item .card{order:-1}
  .canvas{min-height:0}
  .panel{padding:18px}
  .tabs button,.decided table,.evidence,.based{font-size:14px}
  .rec,.label{font-size:12px}
  .stage .tall{display:block}
  .stage .tall + .wide{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="themebar"><button type="button" class="theme" id="theme" aria-pressed="false" aria-label="Dark mode">Dark</button></div>
  <header>
    <p class="eyebrow">For review</p>
    <h1>Report layout and chart style</h1>
    <p class="lede">Two choices for the weekly report. Leave a comment on any card.</p>
  </header>
  <main id="cards"></main>
  <details class="decided" id="decided" hidden><summary>Decided so far</summary><table id="decided-rows"></table></details>
</div>
<script>
// Each card: a stable id (its section is id="card-<id>"), title, question, optional label,
// options [[value, label]], optional rec, previews { value: HTML or inline SVG } with optional
// previewsTall for phones, optional headline { num, cap }, evidence, why (short HTML, closed),
// based, and ask (the comment line; a default is used without it). A card without options is a
// content card: give it body (short HTML) and preview (one visual, previewTall for phones).
const lines = (x, y, n, w) => Array.from({ length: n }, (_, i) => `<rect x="${x}" y="${y + i * 22}" width="${w}" height="8" rx="4" fill="currentColor" opacity=".25"/>`).join('');
const onePage = `<svg viewBox="0 0 320 220" role="img" aria-label="One page with a summary table">
  <rect x="1" y="1" width="318" height="218" rx="10" fill="none" stroke="currentColor" opacity=".3"/>
  <rect x="20" y="20" width="140" height="14" rx="4" fill="currentColor" opacity=".8"/>
  <rect x="20" y="50" width="280" height="150" rx="6" fill="none" stroke="currentColor" opacity=".4"/>
  <line x1="113" y1="50" x2="113" y2="200" stroke="currentColor" opacity=".3"/><line x1="206" y1="50" x2="206" y2="200" stroke="currentColor" opacity=".3"/>
  ${lines(30, 66, 6, 70)}${lines(123, 66, 6, 70)}${lines(216, 66, 6, 70)}</svg>`;
const sections = `<svg viewBox="0 0 320 220" role="img" aria-label="A section per area">
  <rect x="1" y="1" width="318" height="218" rx="10" fill="none" stroke="currentColor" opacity=".3"/>
  ${[20, 90, 160].map((y) => `<rect x="20" y="${y}" width="110" height="12" rx="4" fill="currentColor" opacity=".8"/>${lines(20, y + 22, 2, 280)}`).join('')}</svg>`;
const bars = (a, b) => `<svg viewBox="0 0 320 120" role="img" aria-label="${a} of 10 against ${b} of 10">
  <rect x="0" y="20" width="${a * 30}" height="30" rx="6" fill="currentColor" opacity=".85"/><text x="${a * 30 + 8}" y="41" fill="currentColor">${a} of 10</text>
  <rect x="0" y="70" width="${b * 30}" height="30" rx="6" fill="currentColor" opacity=".35"/><text x="${b * 30 + 8}" y="91" fill="currentColor">${b} of 10</text></svg>`;
const CARDS = [
  {
    id: 'layout', label: 'D-1', title: 'Report layout', question: 'Which layout should the weekly report use?',
    options: [['one-page', 'One page with a summary table'], ['sections', 'A section per area']],
    rec: 'one-page',
    headline: { num: '2 of 3', cap: 'readers stop after the first screen' },
    evidence: 'The summary table answers the first question without scrolling.',
    why: 'Most readers stop after the first screen, so the summary goes first.',
    based: 'reader feedback and last month\'s reading times',
    previews: { 'one-page': onePage, sections },
  },
  {
    id: 'chart', label: 'D-2', title: 'Chart style', question: 'Bars or a table for the weekly numbers?',
    options: [['bars', 'Bars on one scale'], ['table', 'Table only']],
    rec: 'bars',
    previews: {
      bars: bars(8, 5),
      table: `<svg viewBox="0 0 320 120" role="img" aria-label="Table of the weekly numbers">
        <rect x="1" y="1" width="318" height="118" rx="8" fill="none" stroke="currentColor" opacity=".4"/><line x1="1" y1="60" x2="319" y2="60" stroke="currentColor" opacity=".3"/><line x1="200" y1="1" x2="200" y2="119" stroke="currentColor" opacity=".3"/>
        <text x="16" y="36" fill="currentColor">This week</text><text x="216" y="36" fill="currentColor">8 of 10</text>
        <text x="16" y="96" fill="currentColor">Last week</text><text x="216" y="96" fill="currentColor">5 of 10</text></svg>`,
    },
  },
];

// Already decided, shown collapsed under the cards: [topic, decision, date].
const DECIDED = [
  ['Report cadence', 'Weekly, sent on Friday', '1 Sep'],
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9_-]+/g, '-');
const ASK_PICK = 'Comment on this card with your pick, or with what would change it.';
const ASK_READ = 'Comment on this card with any question or correction.';
const shown = {};

// Light is the default. The switch sets data-theme="dark" and remembers the choice for this page.
const themeKey = 'comment-cards-theme:' + location.pathname;
function setTheme(dark, save) {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('theme').setAttribute('aria-pressed', String(dark));
  $('theme').textContent = dark ? 'Light' : 'Dark';
  if (save) { try { localStorage.setItem(themeKey, dark ? 'dark' : 'light'); } catch (e) {} }
}
setTheme(document.documentElement.dataset.theme === 'dark', false);
$('theme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme !== 'dark', true));

const stageHtml = (wide, tall) => `${tall ? `<div class="tall">${tall}</div>` : ''}<div class="wide">${wide || ''}</div>`;

function canvasHtml(c) {
  if (!c.options?.length) return `<h2>${esc(c.title)}</h2><div class="stage">${stageHtml(c.preview, c.previewTall)}</div>`;
  const current = shown[c.id] || c.rec || c.options[0][0];
  const tabs = c.options.map(([v, l]) => `<button type="button" aria-pressed="${v === current}" data-card="${esc(c.id)}" data-v="${esc(v)}">${esc(l)}</button>`).join('');
  return `<h2>${esc(c.title)}</h2><div class="tabs" role="group" aria-label="Option previews">${tabs}</div><div class="stage">${stageHtml(c.previews?.[current], c.previewsTall?.[current])}</div>`;
}

function cardHtml(c, n) {
  const id = slug(c.id);
  const label = `<p class="label">${c.label ? `${esc(c.label)} · ` : ''}${n} of ${CARDS.length}</p>`;
  const opts = c.options?.length
    ? `<ul class="opts">${c.options.map(([v, l]) => `<li${v === c.rec ? ' class="is-rec"' : ''}><span>${esc(l)}</span>${v === c.rec ? '<span class="rec">Recommended</span>' : ''}</li>`).join('')}</ul>`
    : '';
  return `<section class="item" id="card-${id}" aria-labelledby="card-${id}-q">
    <div class="panel canvas" id="card-${id}-canvas">${canvasHtml(c)}</div>
    <div class="panel card">${label}<h2 id="card-${id}-q">${esc(c.question || c.title)}</h2>
      ${c.headline ? `<div class="headline"><span class="num">${esc(c.headline.num)}</span><span class="cap">${esc(c.headline.cap)}</span></div>` : ''}
      ${c.body ? `<div class="body">${c.body}</div>` : ''}
      ${opts}
      ${c.evidence ? `<p class="evidence">${esc(c.evidence)}</p>` : ''}
      ${c.why ? `<details><summary>Why</summary><p>${c.why}</p></details>` : ''}
      <p class="ask" id="card-${id}-ask">${esc(c.ask || (c.options?.length ? ASK_PICK : ASK_READ))}</p>
      ${c.based ? `<p class="based">Based on: ${esc(c.based)}</p>` : ''}
    </div>
  </section>`;
}

// Flipping a preview redraws only that card's picture, so open "Why" folds stay open.
function bindTabs(root) {
  root.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    const c = CARDS.find((x) => x.id === b.dataset.card);
    shown[c.id] = b.dataset.v;
    const canvas = $(`card-${slug(c.id)}-canvas`);
    canvas.innerHTML = canvasHtml(c);
    bindTabs(canvas);
  }));
}

function render() {
  $('cards').innerHTML = CARDS.map((c, i) => cardHtml(c, i + 1)).join('');
  bindTabs($('cards'));
}

if (DECIDED.length) {
  $('decided').hidden = false;
  $('decided-rows').innerHTML = DECIDED.map((row) => `<tr>${row.map((cell) => `<td>${esc(cell)}</td>`).join('')}</tr>`).join('');
}

render();
</script>
</body>
</html>
